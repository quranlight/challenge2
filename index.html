#title{position:absolute;top:66px;left:540px;width:1200px;text-align:center}
#title h1{font-size:72px;color:var(--wine);line-height:1.2;font-weight:700;white-space:nowrap}
#title p{font-size:34px;margin-top:2px;opacity:.8}
#dots{position:absolute;top:272px;left:540px;width:1200px;display:flex;justify-content:center;gap:22px}
#dots i{width:24px;height:24px;border-radius:50%;border:3px solid var(--wine);transition:.4s}
#dots i.on{background:var(--rose);transform:scale(1.25)}
#dots i.done{background:var(--wine)}
.hd,.slot,.card{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:16px}
.hd{top:334px;height:90px;width:300px;font-size:44px;font-weight:700;background:linear-gradient(160deg,#7d2a42,#521a2b);color:#f8ecd8;border:3px solid var(--gold);box-shadow:0 6px 18px rgba(60,10,25,.3)}
.hd.t{width:260px;background:linear-gradient(160deg,#a8566e,#7d3a4f)}
.slot{width:300px;height:104px;border:2px dashed rgba(110,35,56,.45);background:rgba(251,247,238,.35);transition:background .25s,border-color .25s}
.slot.cur{border:3px solid var(--gold);background:rgba(201,161,90,.18)}
.slot.hot{background:rgba(201,161,90,.5)}
.slot.lab{width:260px;font-size:29px;font-weight:700;line-height:1.2;padding:0 12px}
.slot.lab.on{background:var(--wine);color:#f8ecd8;border:3px solid var(--gold);animation:pop .6s both}
.card{width:400px;height:100px;font-size:38px;font-weight:700;line-height:1.2;padding:0 14px;background:rgba(251,247,238,.96);border:3px solid var(--wine);box-shadow:0 8px 20px rgba(60,20,30,.25);cursor:grab;touch-action:none;z-index:5;transition:left .45s,top .45s,width .45s,height .45s,font-size .45s,background .3s;animation:pop .6s both}
.card.drag{transition:none;z-index:50;cursor:grabbing;transform:scale(1.06);box-shadow:0 16px 30px rgba(60,20,30,.4);animation:none}
.card.placed{width:300px;height:104px;font-size:30px;line-height:1.15;background:#e3f1e6;border-color:var(--ok);cursor:default;box-shadow:none;z-index:3}
.card.bad{border-color:var(--bad);animation:shake .45s}
#pt{position:absolute;left:110px;top:512px;width:400px;text-align:center;font-size:34px;color:var(--wine);font-weight:700}
#done{position:absolute;left:110px;top:600px;width:400px;display:none;flex-direction:column;align-items:center;gap:20px;text-align:center}
#done.show{display:flex;animation:pop .8s both}
#done b{font-size:64px;color:var(--wine)}
#done span{font-size:34px}
#done button{font:700 38px 'Amiri',serif;padding:10px 44px;border-radius:50px;border:3px solid var(--gold);background:var(--wine);color:#f8ecd8;cursor:pointer}
canvas#fx{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none;z-index:60}
@keyframes pop{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes shake{25%{transform:translateX(-14px)}75%{transform:translateX(14px)}}
@media (prefers-reduced-motion:reduce){.card,.slot.lab.on{animation:none}}

<body>
<div id="wrap"><div id="stage">
  <div id="title"><h1 id="topic"></h1><p id="sub">اسحب كل إجابة وأفلتها في السورة المناسبة لها</p></div>
  <div id="dots"></div>
  <div id="pt">الإجابات</div>
  <div id="done"><b>أحسنت!</b><span>أتممت جميع المجموعات الخمس</span><button id="again">إعادة اللعبة</button></div>
  <canvas id="fx" width="1920" height="1080"></canvas>
</div></div>
<script>
const SURAHS=['سورة هود','سورة الحجر','سورة الذاريات'];
const ROUNDS=[
 {t:'بداية القصة',a:['ولقد جاءت رسلنا','إذ دخلوا عليه','إذ دخلوا عليه']},
 {t:'السلام وجوابه',a:['قال سلام','لم يرد السلام (إنا منكم وجلون)','قال سلام']},
 {t:'البشارة بالغلام',a:['باسحاق ويعقوب','نبشرك بغلام عليم','وبشروه بغلام عليم']},
 {t:'تقديم الضيافة',a:['حنيذ','لم يذكر في هذا الموضع','عجل سمين']},
 {t:'موقف إبراهيم عليه السلام من الملائكة',a:['وأوجس منهم خيفة','وجلون','فأوجس منهم خيفة']}
];
const X=[1166,852,538],TX=1480,ROW0=440,PITCH=112,$=id=>document.getElementById(id);
const stage=$('stage');
let r=0,placed=0,filled=[],locked=false,scale=1,drag=null,cards=[];
function fit(){scale=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform='translate(-50%,-50%) scale('+scale+')'}
addEventListener('resize',fit);fit();

function el(cls,txt,x,y,p){const d=document.createElement('div');d.className=cls;d.textContent=txt||'';d.style.left=x+'px';d.style.top=y+'px';(p||stage).appendChild(d);return d}
const slots=[],labs=[];
SURAHS.forEach((s,i)=>el('hd',s,X[i],334));
el('hd t','الموضوع',TX,334);
for(let k=0;k<5;k++){
  slots.push(SURAHS.map((_,i)=>el('slot','',X[i],ROW0+k*PITCH)));
  labs.push(el('slot lab','',TX,ROW0+k*PITCH));
  const d=document.createElement('i');$('dots').appendChild(d);
}
const shuffle=a=>{let b;do{b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[b[i],b[j]]=[b[j],b[i]]}}while(b.every((x,i)=>x.k===a[i].k));return b};

function render(){
  placed=0;filled=[false,false,false];locked=false;
  $('done').classList.remove('show');$('pt').style.display='';
  $('topic').textContent=ROUNDS[r].t;$('sub').textContent='اسحب كل إجابة وأفلتها في السورة المناسبة لها';
  [...$('dots').children].forEach((e,i)=>e.className=i<r?'done':i==r?'on':'');
  slots.forEach((row,k)=>row.forEach(s=>s.classList.toggle('cur',k===r)));
  cards=shuffle(ROUNDS[r].a.map((t,k)=>({t,k}))).map((it,pos)=>{
    const c=el('card',it.t,110,580+pos*114);c.dataset.t=it.t;c.style.animationDelay=(pos*.12)+'s';c.homeY=580+pos*114;return c});
}
const pt=e=>{const b=stage.getBoundingClientRect();return{x:(e.clientX-b.left)/scale,y:(e.clientY-b.top)/scale}};
const colAt=p=>X.findIndex(x=>p.x>=x&&p.x<=x+300&&p.y>=334&&p.y<=1010);
function hot(c){slots.forEach(row=>row.forEach(s=>s.classList.remove('hot')));if(c>=0&&!filled[c])slots[r][c].classList.add('hot')}

stage.addEventListener('pointerdown',e=>{
  const c=e.target.closest('.card');if(!c||locked||c.classList.contains('placed'))return;
  const p=pt(e);drag={c,dx:p.x-parseFloat(c.style.left),dy:p.y-parseFloat(c.style.top)};
  c.classList.add('drag');e.preventDefault();
});
addEventListener('pointermove',e=>{
  if(!drag)return;const p=pt(e);
  drag.c.style.left=(p.x-drag.dx)+'px';drag.c.style.top=(p.y-drag.dy)+'px';hot(colAt(p));
});
addEventListener('pointerup',e=>{
  if(!drag)return;const c=drag.c;drag=null;hot(-1);c.classList.remove('drag');
  const col=colAt(pt(e));
  if(col>=0&&!filled[col]&&c.dataset.t===ROUNDS[r].a[col]){
    filled[col]=true;c.classList.add('placed');
    c.style.left=X[col]+'px';c.style.top=(ROW0+r*PITCH)+'px';
    if(++placed===3){locked=true;burst(7);setTimeout(()=>{labs[r].textContent=ROUNDS[r].t;labs[r].classList.add('on')},500);setTimeout(next,3600)}
  }else{
    if(col>=0){c.classList.add('bad');setTimeout(()=>c.classList.remove('bad'),500)}
    c.style.left='110px';c.style.top=c.homeY+'px';
  }
});
function next(){
  r++;
  if(r>=ROUNDS.length){
    [...$('dots').children].forEach(e=>e.className='done');slots.forEach(row=>row.forEach(s=>s.classList.remove('cur')));
    $('topic').textContent='اكتمل الجدول';$('sub').textContent='جميع الإجابات الصحيحة أمامك';
    $('pt').style.display='none';$('done').classList.add('show');burst(10);return;
  }
  render();
}
$('again').onclick=()=>{document.querySelectorAll('.card').forEach(c=>c.remove());labs.forEach(l=>{l.textContent='';l.classList.remove('on')});r=0;render()};

// fireworks
const cv=$('fx'),cx=cv.getContext('2d');let ps=[],raf=0;
const COLS=['#b3123f','#c9a15a','#6e2338','#d9577a','#e8b04a','#8c2f5a'];
function burst(n){
  for(let i=0;i<n;i++)setTimeout(()=>{
    const x=300+Math.random()*1320,y=160+Math.random()*420,c=COLS[Math.random()*COLS.length|0];
    for(let k=0;k<90;k++){const a=Math.random()*6.283,v=3+Math.random()*9;
      ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,c,s:3+Math.random()*4})}
    if(!raf)raf=requestAnimationFrame(tick);
  },i*320);
}
function tick(){
  cx.clearRect(0,0,1920,1080);
  ps=ps.filter(p=>p.life>0);
  ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.975;p.vy=p.vy*.975+.18;p.life-=.011;
    cx.globalAlpha=Math.max(p.life,0);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.s,0,6.283);cx.fill()});
  cx.globalAlpha=1;
  if(ps.length)raf=requestAnimationFrame(tick);else{cx.clearRect(0,0,1920,1080);raf=0}
}
render();
</script>
